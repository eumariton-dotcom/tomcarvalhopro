<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-in — Live do Tom Carvalho</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px 0}
.box{width:min(480px,calc(100% - 40px))}
.box > * + *{margin-top:18px}
.brand{font-size:.9rem;color:var(--ink-2);font-weight:500}
h1{font-size:clamp(1.7rem,4.5vw,2.4rem)}
#done{display:none}
</style>
</head>
<body>
<main class="box">
  <div id="ask">
    <p class="brand">Tom Carvalho · Funil de live semanal</p>
    <h1>Confirme sua entrada na live</h1>
    <p class="muted">Use o mesmo e-mail da inscrição.</p>
    <form id="form" novalidate style="margin-top:22px">
      <label class="field"><span>Nome</span><input type="text" name="nome" autocomplete="name" placeholder="Seu nome"></label>
      <label class="field"><span>E-mail</span><input type="email" name="email" autocomplete="email" inputmode="email" placeholder="voce@email.com" required><em class="err">Digite um e-mail válido.</em></label>
      <button class="btn wide" type="submit" id="btn" style="margin-top:18px">Entrar na live</button>
      <p class="fine" style="margin-top:12px">Você será levado direto para a transmissão.</p>
    </form>
  </div>
  <div id="done">
    <p class="brand">Tom Carvalho · Funil de live semanal</p>
    <h1 id="hello">Bem-vindo!</h1>
    <p class="muted">Abrindo a transmissão…</p>
    <p><a class="btn wide" id="open" href="#">Abrir a live</a></p>
  </div>
</main>
<script>
// ====== CONFIGURAÇÃO — edite aqui ======
const LIVE_URL = 'https://COLOQUE-O-LINK-DA-LIVE-AQUI'; // ← TROQUE AQUI antes de cada live. O redirect usa isto, sem depender de nada.
const WEBHOOK  = 'https://n8n-n8n.mchvfo.easypanel.host/webhook/checkin-lead'; // só registra a presença, em segundo plano
// =======================================
const qs = new URLSearchParams(location.search);
const form = document.getElementById('form'), btn = document.getElementById('btn');
// pré-preenche pelo link (?e=&n=) ou pelo que a página de captura guardou
let saved = {}; try { saved = JSON.parse(localStorage.getItem('tc_lead') || '{}'); } catch(e){}
form.email.value = qs.get('e') || saved.email || '';
form.nome.value  = qs.get('n') || saved.nome  || '';

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const email = form.email.value.trim().toLowerCase();
  const nome  = form.nome.value.trim();
  const f = form.email.closest('.field');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { f.classList.add('bad'); return; }
  f.classList.remove('bad');
  btn.disabled = true; btn.textContent = 'Entrando…';
  // registra a presença em segundo plano — não espera resposta, não trava o lead
  try { fetch(WEBHOOK, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, nome }), keepalive: true }).catch(() => {}); } catch(e) {}
  try { localStorage.setItem('tc_lead', JSON.stringify({ nome, email, t: Date.now() })); } catch(e){}
  document.getElementById('hello').textContent = nome ? 'Bem-vindo, ' + nome.split(' ')[0] + '!' : 'Bem-vindo!';
  document.getElementById('open').href = LIVE_URL;
  document.getElementById('ask').style.display = 'none';
  document.getElementById('done').style.display = 'block';
  setTimeout(() => location.replace(LIVE_URL), 400);
});
</script>
</body>
</html>
