<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Falta um passo — entre no grupo</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px 0}
.box{max-width:560px;margin:0 20px}
.box > * + *{margin-top:20px}
.box h1{font-size:clamp(1.8rem,4.5vw,2.6rem)}
.small{font-size:.85rem;color:var(--ink-2)}
</style>
</head>
<body>
<main class="box">
  <p class="muted">Inscrição recebida<span id="nome"></span>.</p>
  <h1>Falta um passo: entre no grupo do WhatsApp.</h1>
  <p class="lead">É por lá que chega o link da aula, o lembrete no dia e o material. Sem o grupo, você não recebe nada.</p>
  <p><a class="btn wide" id="grupo" href="#">Entrar no grupo do WhatsApp</a></p>
  <p class="small">Se o botão não abrir, copie o link: <span id="link"></span></p>
</main>
<script>
// ====== CONFIGURAÇÃO — edite aqui ======
const GRUPO_URL = 'https://chat.whatsapp.com/COLE-O-LINK-DO-GRUPO';
// =======================================
const n = new URLSearchParams(location.search).get('n');
if (n) document.getElementById('nome').textContent = ', ' + n;
document.getElementById('grupo').href = GRUPO_URL;
document.getElementById('link').textContent = GRUPO_URL;
</script>
</body>
</html>
